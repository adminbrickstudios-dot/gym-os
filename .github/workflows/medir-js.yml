# E4 · Mide el JavaScript por ruta del panel con `next build` (a mano: Actions → Medir JS por ruta → Run workflow).
# El resultado queda en el resumen de la corrida y en el artefacto js-rutas.
name: Medir JS por ruta

on:
  workflow_dispatch:

jobs:
  medir:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ejemplo.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: clave-de-build
      NEXT_PUBLIC_DOMINIO_BASE: ejemplo.com
      NEXT_PUBLIC_DOMINIO_PLATAFORMA: app.ejemplo.com
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx next build
      - name: JS por ruta
        run: |
          mkdir -p .local
          node scripts/medir/js-rutas.mjs --json .local/js-rutas.json | tee .local/js-rutas.md
          { echo '### JS por ruta del panel'; cat .local/js-rutas.md; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: js-rutas
          path: .local/js-rutas.*
