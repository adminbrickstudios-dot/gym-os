# F1.8 / F0 · Lighthouse en celular contra la app COMPILADA (next build + next start), con una base nueva y el demo sembrado.
# A mano: Actions → Lighthouse → Run workflow. Mide la landing de un gimnasio demo con datos, /ingresar (equipo y socio) y /hacete-socio.
# La tabla (performance, accesibilidad, buenas prácticas, SEO, LCP, CLS, TBT) va al resumen de la corrida y se sube como artefacto.
# Si la performance móvil de la landing queda por debajo del umbral, el job lo avisa (::warning::) pero NO falla.
#   gh workflow run lighthouse.yml --ref <rama> --raw-field veces=3
# La app del socio con sesión no se mide acá (pide login): queda para una pasada con cookie.
name: Lighthouse

on:
  # Hasta que este archivo esté en main, GitHub no deja dispararlo a mano: un push a dia/** con [lighthouse] en el mensaje lo corre.
  push:
    branches: ["dia/**"]
  workflow_dispatch:
    inputs:
      veces:
        description: "Corridas por pantalla (se usa la mediana)"
        type: string
        default: "3"
      umbral:
        description: "Performance mínima de la landing en celular (solo avisa)"
        type: string
        default: "90"
      estilo:
        description: "Pase 2.0: estilo de los gimnasios demo (clasico o pista)"
        type: string
        default: "clasico"
      modo:
        description: "Pase 2.0: modo de Pista (oscuro o claro)"
        type: string
        default: "oscuro"
      semaforo:
        description: "Pista Semáforo: la llave pista_semaforo en los demo (si o no; solo se ve con estilo=pista)"
        type: string
        default: "si"
      landings:
        description: "Vuelta final: vieja (las de siempre) o nueva (prende landing_nueva en el demo y landing_venta_nueva en la base de esta corrida, y mide también la venta de Pase)"
        type: string
        default: "vieja"
      ruta_demo:
        description: "Dirección del gimnasio demo (sin barra final)"
        type: string
        default: "http://demo.localhost:3123"

env:
  PGHOST: localhost
  PGPORT: "5432"
  PGUSER: postgres

jobs:
  medir:
    name: Lighthouse móvil
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[lighthouse]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Base nueva
        run: scripts/db/local.sh nueva
      - name: Levantar la app compilada con la imitación de Supabase
        env:
          APP_MODO: produccion
          ESTILO_DEMO: ${{ inputs.estilo || 'clasico' }}
          SEMAFORO_DEMO: ${{ inputs.semaforo || 'si' }}
          MODO_DEMO: ${{ inputs.modo || 'oscuro' }}
          NODE_OPTIONS: --max-old-space-size=4096
        run: scripts/local/levantar.sh
      - name: Chrome
        run: |
          echo "CHROME_PATH=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)" >> "$GITHUB_ENV"
          "$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)" --version
      - name: Prender las landings nuevas (solo en la base de esta corrida)
        if: inputs.landings == 'nueva'
        run: |
          U="$(scripts/db/local.sh url)"
          psql "$U" -v ON_ERROR_STOP=1 -c "insert into public.funciones_nuevas_gimnasio (gimnasio_id, clave, activa, prendida_en, cambiada_en) select id, 'landing_nueva', true, now(), now() from public.gimnasios where slug = 'demo' on conflict (gimnasio_id, clave) do update set activa = true, cambiada_en = now()"
          psql "$U" -v ON_ERROR_STOP=1 -c "update public.plataforma_ajustes set valor = 'true' where clave = 'landing_venta_nueva'"
          # La caché del proxy y de la página dura hasta 60 s: se espera a que las dos salgan nuevas (una condición, no un tiempo fijo).
          for i in $(seq 1 40); do
            g=$(curl -s "${{ inputs.ruta_demo || 'http://demo.localhost:3123' }}/" | grep -c 'data-landing-nueva' || true)
            p=$(curl -s "http://localhost:3123/" | grep -c 'data-plataforma-nueva' || true)
            if [ "$g" -gt 0 ] && [ "$p" -gt 0 ]; then echo "las dos landings nuevas a la vista"; exit 0; fi
            sleep 3
          done
          echo "::error::las landings nuevas no aparecieron (gimnasio=$g plataforma=$p)"; exit 1
      - name: Lighthouse en celular
        env:
          LIGHTHOUSE_VERSION: "12.6.1"
        run: node scripts/medir/lighthouse.mjs --base "${{ inputs.ruta_demo || 'http://demo.localhost:3123' }}" --veces "${{ inputs.veces || '3' }}" --umbral "${{ inputs.umbral || '90' }}" ${{ inputs.landings == 'nueva' && '--plataforma http://localhost:3123' || '' }}
      - name: Guardar la tabla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse
          path: |
            .local/lighthouse/
            .local/app.log
          if-no-files-found: ignore
          retention-days: 30
