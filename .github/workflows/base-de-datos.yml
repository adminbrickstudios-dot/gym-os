# Base de datos de producción, con un botón: Actions → "Base de datos" → Run workflow.
# Necesita el secreto SUPABASE_DB_URL (Settings → Secrets and variables → Actions).
#
#   prevuelo   corre las migraciones pendientes en una transacción que se revierte
#   aplicar    prevuelo + aplica + chequeos del proyecto contra la base real
#   chequeos   solo los chequeos (RLS, permisos, search_path…)
#   hacer-admin  da super admin a la cuenta del mail indicado
#   estado     qué gimnasios hay, sus direcciones y si el dueño tiene acceso (sin datos personales)
#   humo-pasado  prueba en el demo de producción (transacción que revierte): alta con fecha y pago pasados + caja por medio
#   sembrar-demo  crea el "Gimnasio Demo" con datos ficticios (300 socios) para mostrar el sistema
#   usuarios-demo crea los logins del demo (dueña, encargado, recepción, profe, socio) con la
#                 contraseña que pongas; NO crea un super admin demo. Necesita los secretos
#                 SUPABASE_URL y SUPABASE_SERVICE_ROLE_KEY.
#
# Nunca corre solo: siempre lo dispara una persona. Cuando haya gimnasios
# reales, este botón es el "yo la corro" de las reglas del proyecto.
name: Base de datos

on:
  workflow_dispatch:
    inputs:
      accion:
        description: "Qué hacer"
        type: choice
        options: [prevuelo, aplicar, chequeos, hacer-admin, estado, humo-pasado, sembrar-demo, usuarios-demo]
        default: prevuelo
      email:
        description: "Mail (solo para hacer-admin)"
        required: false
      dominio:
        description: "Dominio de los gimnasios (solo para sembrar-demo, ej: gym-os-pied.vercel.app)"
        required: false
      contrasena:
        description: "Contraseña de los usuarios demo (solo para usuarios-demo, 10 o más letras)"
        required: false
      sin_copia:
        description: "Solo con permiso de Mateo: escribí SIN COPIA para aplicar sin la copia cifrada previa (si algo sale mal, no hay copia para volver)"
        required: false
        default: ""

concurrency:
  group: base-de-datos
  cancel-in-progress: false

jobs:
  base:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Falta el secreto
        if: env.SUPABASE_DB_URL == ''
        env:
          COMO_VARIABLE: ${{ vars.SUPABASE_DB_URL != '' }}
        run: |
          if [ "$COMO_VARIABLE" = "true" ]; then
            echo "::error::SUPABASE_DB_URL está cargado como VARIABLE (se ve en texto plano). Borralo de la pestaña Variables y cargalo en la pestaña Secrets → New repository secret."
          else
            echo "::error::GitHub no le pasa SUPABASE_DB_URL a este workflow. Tiene que estar en Settings → Secrets and variables → Actions → pestaña Secrets → 'Repository secrets' (no en Environments, Codespaces ni Dependabot), con ese nombre exacto."
          fi
          exit 1
      - name: Sin copia previa (Mateo lo autorizó para esta publicación)
        if: inputs.accion == 'aplicar' && inputs.sin_copia == 'SIN COPIA'
        run: echo "::warning::Se aplica SIN copia cifrada previa, con permiso de Mateo. Si algo sale mal en la base, no hay copia para volver."
      - name: Copia cifrada ANTES de aplicar (H5; sin COPIA_CLAVE no se aplica)
        if: inputs.accion == 'aplicar' && inputs.sin_copia != 'SIN COPIA'
        env:
          COPIA_CLAVE: ${{ secrets.COPIA_CLAVE }}
        run: |
          if [ -z "$COPIA_CLAVE" ] || [ ${#COPIA_CLAVE} -lt 16 ]; then
            echo "::error::Falta el secreto COPIA_CLAVE (16 o más caracteres). Hay datos reales de un cliente en producción: sin copia cifrada previa NO se aplica ninguna migración. Pasos en docs/base/COPIAS.md."
            exit 1
          fi
          echo "::add-mask::$COPIA_CLAVE"
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          export PATH="/usr/lib/postgresql/17/bin:$PATH"
          node scripts/db/copia.mjs exportar --salida copias-salida
      - name: Guardar la copia cifrada (artefacto privado, 30 días)
        if: inputs.accion == 'aplicar' && inputs.sin_copia != 'SIN COPIA'
        uses: actions/upload-artifact@v4
        with:
          name: base-copia-previa-${{ github.run_id }}
          path: copias-salida/*.tar.gz.enc
          retention-days: 30
          if-no-files-found: error
      - name: Pre-vuelo (transacción que se revierte)
        if: inputs.accion == 'prevuelo' || inputs.accion == 'aplicar'
        run: node scripts/db/aplicar.mjs --prevuelo
      - name: Aplicar migraciones
        if: inputs.accion == 'aplicar'
        run: node scripts/db/aplicar.mjs
      - name: Chequeos del proyecto contra la base real
        if: inputs.accion == 'aplicar' || inputs.accion == 'chequeos'
        run: node scripts/chequeos.mjs
      - name: Hacer super admin
        if: inputs.accion == 'hacer-admin'
        env:
          EMAIL: ${{ inputs.email }}
        run: node scripts/datos/hacer-admin.mjs --email "$EMAIL"
      - name: Estado de la base
        if: inputs.accion == 'estado'
        run: node scripts/datos/estado-base.mjs
      - name: Humo de cargar en el pasado y caja por medio (demo, transacción que revierte)
        if: inputs.accion == 'humo-pasado'
        run: node scripts/datos/humo-pasado-produccion.mjs
      - name: Sembrar el gimnasio demo
        if: inputs.accion == 'sembrar-demo'
        env:
          DOMINIO: ${{ inputs.dominio }}
        run: |
          if [ -z "$DOMINIO" ]; then echo "::error::Falta el dominio (ej: gym-os-pied.vercel.app)"; exit 1; fi
          node scripts/datos/sembrar-demo.mjs --dominio "$DOMINIO"
          node scripts/datos/estado-base.mjs
      - name: Usuarios del demo
        if: inputs.accion == 'usuarios-demo'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CONTRASENA: ${{ inputs.contrasena }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then echo "::error::Faltan los secretos SUPABASE_URL y SUPABASE_SERVICE_ROLE_KEY (Settings → Secrets and variables → Actions → Secrets)"; exit 1; fi
          if [ ${#CONTRASENA} -lt 10 ]; then echo "::error::Poné una contraseña de 10 o más letras para los usuarios demo"; exit 1; fi
          echo "::add-mask::$CONTRASENA"
          node scripts/datos/usuarios-demo.mjs --url "$SUPABASE_DB_URL" --supabase "$SUPABASE_URL" --servicio "$SUPABASE_SERVICE_ROLE_KEY" --contrasena "$CONTRASENA" --sin-admin
