name: Sonda dominios (temporal)
on:
  push:
    branches: [sonda/dominios-1511]
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in https://gym-os-pied.vercel.app/g/templegym1/hacete-socio?o=qr https://pasegym.com/g/templegym1 https://pasegym.com/g/demo https://pasegym.com/g/templegym https://templegymsalta.com/hacete-socio; do
            printf "%-60s " "$u"; curl -s -L -m 20 -o /tmp/p.html -w "%{http_code} final=%{url_effective}  " "$u"; grep -oE "<title>[^<]*</title>" /tmp/p.html | head -1
          done
