name: Sonda dominios (temporal)
on:
  push:
    branches: [sonda/dominios-1511]
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          for u in "https://gym-os-pied.vercel.app/g/templegym1/hacete-socio?o=qr" "https://pasegym.com/g/demo" "https://templegymsalta.com/hacete-socio"; do
            printf "%s -> " "$u"; curl -s -L -m 20 -o /tmp/p.html -w "%{http_code} %{url_effective} " "$u"; grep -oE "<title>[^<]*</title>" /tmp/p.html | head -1; echo
          done
