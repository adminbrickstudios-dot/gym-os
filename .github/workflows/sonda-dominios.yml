name: Sonda dominios (temporal)
on:
  push:
    branches: [sonda/dominios-1511]
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for s in templegym1 templegym temple-gym templegymsalta temple temple-gym-salta; do
            printf "%-18s " $s; curl -s -o /dev/null -m 20 -w "%{http_code} %{redirect_url}\n" "https://pasegym.com/g/$s"
          done
          curl -s -m 20 https://templegymsalta.com/ | grep -oE '"(slug|gimnasio_slug)":"[^"]+"' | sort -u | head
          curl -s -m 20 https://templegymsalta.com/ | grep -oE '/g/[a-z0-9-]+' | sort -u | head
