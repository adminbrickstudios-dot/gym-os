name: Sonda dominios (temporal)
on:
  push:
    branches: [sonda/dominios-1511]
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          for u in "https://templegymsalta.com/hacete-socio" "https://templegymsalta.com/hacete-socio?o=qr" "https://templegymsalta.com/"; do
            curl -s -m 20 -o /tmp/h.html -w "$u %{http_code}\n" "$u"
            grep -oE 'data-alta-cerrada|data-paso[^ >]*|Tu plan|Tus datos|Reglamento|No se pudo cargar[^<]{0,40}|NEXT_HTTP_ERROR[^"]{0,40}|digest\\?":\\?"[0-9a-z]+' /tmp/h.html | sort | uniq -c | head -8
          done
