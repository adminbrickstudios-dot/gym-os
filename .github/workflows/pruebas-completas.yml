# Las pruebas que una compu con Windows no puede correr: la base de prueba
# (Postgres con la simulación de Supabase), sus pruebas, los chequeos contra
# la base y las pantallas con sesión real (e2e + barrido).
# Corre sola en cada push a una rama noche/** o dia/** (la base, ~5 min).
# Las pantallas (2 a 4 h) corren si el mensaje del commit dice [pantallas],
# o a mano: Actions → Pruebas completas → Run workflow.
# El agente la mira con:  gh run list --workflow pruebas-completas.yml
name: Pruebas completas

on:
  push:
    branches: ["noche/**", "dia/**"]
  workflow_dispatch:
    inputs:
      pantallas:
        description: "Correr también las pantallas (e2e y barrido, 2 a 4 h)"
        type: boolean
        default: true

env:
  PGHOST: localhost
  PGPORT: "5432"
  PGUSER: postgres

jobs:
  base:
    name: Base (migraciones, pruebas y chequeos)
    runs-on: ubuntu-latest
    # Un push nuevo cancela la base del anterior (solo importa la última).
    concurrency:
      group: base-${{ github.ref }}
      cancel-in-progress: true
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Base nueva con todas las migraciones
        run: scripts/db/local.sh nueva
      - name: Pruebas de la base
        run: npm run db:pruebas
      - name: Chequeos del proyecto
        run: DB_PRUEBAS_URL="$(scripts/db/local.sh url)" npm run chequeos
      - name: El demo se siembra
        run: node scripts/datos/sembrar-demo.mjs --url "$(scripts/db/local.sh url)" --dominio localhost

  pantallas:
    name: Pantallas (e2e y barrido)
    # Las pantallas no se cancelan con un push normal: hacen cola.
    concurrency:
      group: pantallas-${{ github.ref }}
      cancel-in-progress: false
    if: (github.event_name == 'workflow_dispatch' && inputs.pantallas) || contains(github.event.head_commit.message, '[pantallas]')
    runs-on: ubuntu-latest
    timeout-minutes: 340
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Base nueva
        run: scripts/db/local.sh nueva
      - name: Levantar la app con la imitación de Supabase
        run: scripts/local/levantar.sh
      - name: Pantallas (e2e, cada recorrido aunque falle otro)
        run: |
          mkdir -p .local
          : > .local/fallas.txt
          for s in $(node -p "require('./package.json').scripts.e2e.split('&&').map((x) => x.trim().replace(/^node /, '')).join(' ')"); do
            echo "::group::$s"
            node "$s" || echo "✗ $s" >> .local/fallas.txt
            echo "::endgroup::"
          done
          if [ -s .local/fallas.txt ]; then echo "Recorridos con fallas:"; cat .local/fallas.txt; exit 1; fi
          echo "Todos los recorridos en verde" 
      - name: Barrido (cada rol abre cada pantalla)
        if: always()
        run: node scripts/e2e/barrido.mjs
      - name: Tiempos (VD-47, avisa y no corta)
        if: always()
        continue-on-error: true
        run: node scripts/medir/tiempos.mjs | tee .local/tiempos.md
      - name: Guardar capturas y logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pantallas
          path: |
            .local/*.log
            .local/fallas.txt
            .local/tiempos.md
            .local/capturas/
          if-no-files-found: ignore
          retention-days: 7
